name: Lint and Validate Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-code:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les outils de vérification
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Vérifier la syntaxe Python (Flake8)
        run: |
          # Vérification des erreurs de syntaxe fatales ou de variables non définies
          flake8 app/main.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Valider la syntaxe Docker Compose
        run: |
          docker compose config
