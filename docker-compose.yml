services:
  # --- SERVICE NEXTCLOUD ---
  nextcloud:
    image: nextcloud:stable-apache
    container_name: nextcloud_app
    restart: unless-stopped
    ports:
      - "8080:80" # Accessible sur http://IP_DE_TON_HOMELAB:8080
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=MonMotDePasseSecurise123! # ⚠️ Change ce mot de passe
    volumes:
      - nextcloud_data:/var/www/html
      # On relie les dossiers de Whisper directement dans le stockage de Nextcloud
      - ./chapitres_audio:/var/www/html/data/Athnor/files/chapitres_audio
      - ./chapitres_ecrits:/var/www/html/data/Athnor/files/chapitres_ecrits
      - ./archives_audio:/var/www/html/data/Athnor/files/archives_audio

  # --- SERVICE WHISPER PIPELINE ---
  whisper-transcriber:
    build: ./app
    container_name: whisper_transcriber
    restart: unless-stopped
    runtime: nvidia
    network_mode: "host"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_SIZE=turbo
      - DEVICE=cuda # Change par "cuda" si tu as une GPU NVIDIA
      - HF_HOME=/root/.cache/huggingface #Définit explicitement le dossier du cache
    deploy: # <- Bloc pour GPU
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./app:/app
      - ./chapitres_audio:/data/chapitres_audio
      - ./chapitres_ecrits:/data/chapitres_ecrits
      - ./archives_audio:/data/archives_audio
      - whisper_model_cache:/root/.cache/huggingface # <- Stocke le modèle téléchargé
    depends_on:
      - nextcloud

volumes:
  nextcloud_data:
  whisper_model_cache:
